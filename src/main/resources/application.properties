spring.application.name=aldrop

server.port=4000

# request handling on virtual threads (Java 25 / Boot 4). Note this makes Tomcat's thread pool
# effectively unbounded, so the connection pool is the only limit left under load.
spring.threads.virtual.enabled=true

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

aldrop.platform-admin.username=${PLATFORM_ADMIN_USERNAME}
aldrop.platform-admin.password=${PLATFORM_ADMIN_PASSWORD}

# QA exposes the OpenAPI docs, anything else (including unset) hides them. See DocsAccessFilter.
aldrop.env=${ENV:}
